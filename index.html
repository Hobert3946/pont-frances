<!doctype html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pont · Francês</title>
  <meta name="description" content="Aprenda francês rápido usando o português e o inglês como pontes.">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090c1a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pont">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita "piscar").
    try {
      const s = JSON.parse(localStorage.getItem('pont:v1') || '{}');
      const t = (s.settings && s.settings.theme) || 'auto';
      const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Pont — início">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f5bff"/><stop offset=".55" stop-color="#8a4fff"/><stop offset="1" stop-color="#ff4f74"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#pg)"/>
        <g fill="none" stroke="#fff" stroke-linecap="round">
          <path d="M12 40Q32 12 52 40" stroke-width="4.5"/>
          <path d="M9 40H55" stroke-width="4.5"/>
          <path d="M22 40V29.5M32 40V26M42 40V29.5" stroke-width="2.6" opacity=".85"/>
          <path d="M17 48Q32 52 47 48" stroke-width="2.6" opacity=".45"/>
        </g>
      </svg>
      <span class="brand-name">Pont</span>
    </a>
    <div class="top-stats">
      <span class="stat-chip streak" id="streakChip" title="Dias seguidos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-7 0-3-1.6-5.4-3.5-7.3-.3 1.7-1.2 3-2.5 3.6C13.6 7.9 12.4 4.6 9.5 2c.2 3.3-1.4 5.3-3 7.2C5.2 10.8 5 12.5 5 15c0 4.3 3 7 7 7z"/></svg>
        <b>0</b>
      </span>
      <span class="stat-chip xp" id="xpChip" title="XP total">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>
        <b>0</b>
      </span>
      <a class="icon-btn" href="#/settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Hoje</span>
    </a>
    <a href="#/lessons" data-tab="lessons">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
      <span>Lições</span>
    </a>
    <a href="#/review" data-tab="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17"/></svg>
      <span>Revisar</span>
      <em class="tab-badge" id="dueBadge" hidden></em>
    </a>
    <a href="#/speak" data-tab="speak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
      <span>Falar</span>
    </a>
    <a href="#/explore" data-tab="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/></svg>
      <span>Explorar</span>
    </a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <noscript><p style="padding:2rem">Ative o JavaScript para usar o Pont.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
