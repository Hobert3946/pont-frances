<!doctype html>
<html lang="pt-BR" data-theme="dark" data-scheme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PONT · L'Atelier du Français</title>
  <meta name="description" content="Aprenda francês rápido usando o português e o inglês como pontes.">
  <meta name="theme-color" content="#050507">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pont">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/base.css?v=3.2.0">
  <link rel="stylesheet" href="css/components.css?v=3.2.0">
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('pont:v1') || '{}');
      if (!s.settings) s.settings = {};
      if (!s.settings.theme || s.settings.theme === 'auto') {
        s.settings.theme = 'dark';
        try { localStorage.setItem('pont:v1', JSON.stringify(s)); } catch (err) { }
      }
      const t = s.settings.theme || 'dark';
      const dark = t !== 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.dataset.scheme = 'dark';
    }
  </script>
</head>

<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="arch-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Pont — início">
        <svg class="brand-mark" width="38" height="38" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="25%" stop-color="#fae49d" />
              <stop offset="60%" stop-color="#d4af37" />
              <stop offset="100%" stop-color="#8a6110" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" fill="#08090d" stroke="url(#pg)" stroke-width="2.5" />
          <g fill="none" stroke="url(#pg)" stroke-linecap="round">
            <path d="M12 41Q32 13 52 41" stroke-width="3.8" />
            <path d="M9 41H55" stroke-width="3.2" />
            <path d="M22 41V30M32 41V25M42 41V30" stroke-width="2.2" opacity=".88" />
            <path d="M17 48Q32 51.5 47 48" stroke-width="1.8" opacity=".45" />
          </g>
        </svg>
        <div class="brand-lockup">
          <span class="brand-name">PONT</span>
          <span class="brand-sub">L'ATELIER DU FRANÇAIS</span>
        </div>
      </a>

      <button class="cmd-trigger" id="searchBtn" aria-label="Buscar (Ctrl+K)" title="Busca Global (Ctrl+K)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span class="cmd-label">Buscar léxico, verbos, sons…</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="top-stats">
        <a class="icon-btn" href="#/stats" aria-label="Conquistas e Estatísticas" title="Conquistas & Métricas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" />
          </svg>
        </a>
        <span class="stat-chip streak" id="streakChip" title="Ofensiva em dias">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 22c4 0 7-2.7 7-7 0-3-1.6-5.4-3.5-7.3-.3 1.7-1.2 3-2.5 3.6C13.6 7.9 12.4 4.6 9.5 2c.2 3.3-1.4 5.3-3 7.2C5.2 10.8 5 12.5 5 15c0 4.3 3 7 7 7z" />
          </svg>
          <b>0</b>
        </span>
        <span class="stat-chip xp" id="xpChip" title="Experiência Acumulada (XP)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" />
          </svg>
          <b>0</b>
        </span>
        <a class="icon-btn" href="#/settings" aria-label="Ajustes" title="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="15" cy="6" r="2" />
            <circle cx="9" cy="12" r="2" />
            <circle cx="17" cy="18" r="2" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="home">
      <i class="tab-idx">01</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <span>Aujourd'hui</span>
    </a>
    <a href="#/guide" data-tab="guide">
      <i class="tab-idx">02</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <polygon points="12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.3 9 8.5 12 2" />
      </svg>
      <span>Trilha</span>
    </a>
    <a href="#/lessons" data-tab="lessons">
      <i class="tab-idx">03</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z" />
      </svg>
      <span>Leçons</span>
    </a>
    <a href="#/review" data-tab="review">
      <i class="tab-idx">04</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="7" width="14" height="14" rx="2.5" />
        <path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17" />
      </svg>
      <span>Réviser</span>
      <em class="tab-badge" id="dueBadge" hidden></em>
    </a>
    <a href="#/speak" data-tab="speak">
      <i class="tab-idx">05</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8" />
      </svg>
      <span>Parler</span>
    </a>
    <a href="#/explore" data-tab="explore">
      <i class="tab-idx">06</i>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
      </svg>
      <span>Atelier</span>
    </a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <noscript>
    <p style="padding:2rem">Ative o JavaScript para usar o Pont.</p>
  </noscript>
  <script type="module" src="js/app.js?v=3.2.0"></script>
</body>

</html>
