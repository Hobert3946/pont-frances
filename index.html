<!doctype html>
<html lang="pt-BR" data-theme="dark" data-scheme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pont · Aprenda Francês</title>
  <meta name="description" content="Aprenda francês rápido usando o português e o inglês como pontes.">
  <meta name="theme-color" content="#050507">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pont">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/base.css?v=4.0.0">
  <link rel="stylesheet" href="css/components.css?v=4.0.0">
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('pont:v1') || '{}');
      if (!s.settings) s.settings = {};
      if (!s.settings.theme || s.settings.theme === 'auto') {
        s.settings.theme = 'dark';
        try { localStorage.setItem('pont:v1', JSON.stringify(s)); } catch (err) { }
      }
      const t = s.settings.theme || 'dark';
      const dark = t !== 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.dataset.scheme = 'dark';
    }
  </script>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Pont — início">
        <svg class="brand-mark" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#16a34a" />
          <g fill="none" stroke="#ffffff" stroke-linecap="round">
            <path d="M12 42Q32 16 52 42" stroke-width="4.5" />
            <path d="M8 42H56" stroke-width="4" />
            <path d="M22 42V31M32 42V26M42 42V31" stroke-width="2.8" opacity=".95" />
          </g>
        </svg>
        <div class="brand-lockup">
          <span class="brand-name">Pont</span>
        </div>
      </a>

      <button class="cmd-trigger" id="searchBtn" aria-label="Buscar (Ctrl+K)" title="Busca Global (Ctrl+K)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span class="cmd-label">Buscar palavras, lições…</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="top-stats">
        <span class="stat-chip streak" id="streakChip" title="Ofensiva de dias">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 22c4 0 7-2.7 7-7 0-3-1.6-5.4-3.5-7.3-.3 1.7-1.2 3-2.5 3.6C13.6 7.9 12.4 4.6 9.5 2c.2 3.3-1.4 5.3-3 7.2C5.2 10.8 5 12.5 5 15c0 4.3 3 7 7 7z" />
          </svg>
          <b>0</b>
        </span>
        <span class="stat-chip xp" id="xpChip" title="Pontos de experiência (XP)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
          <b>0</b>
        </span>
        <a class="icon-btn" href="#/settings" aria-label="Ajustes" title="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="15" cy="6" r="2" />
            <circle cx="9" cy="12" r="2" />
            <circle cx="17" cy="18" r="2" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      <span>Início</span>
    </a>
    <a href="#/learn" data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <polygon points="12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.3 9 8.5 12 2" />
      </svg>
      <span>Trilha</span>
    </a>
    <a href="#/lessons" data-tab="lessons">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z" />
      </svg>
      <span>Lições</span>
    </a>
    <a href="#/review" data-tab="review">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="7" width="14" height="14" rx="2.5" />
        <path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17" />
      </svg>
      <span>Revisar</span>
      <em class="tab-badge" id="dueBadge" hidden></em>
    </a>
    <a href="#/speak" data-tab="speak">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8" />
      </svg>
      <span>Falar</span>
    </a>
    <a href="#/explore" data-tab="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
      </svg>
      <span>Mais</span>
    </a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <noscript>
    <p style="padding:2rem">Ative o JavaScript para usar o Pont.</p>
  </noscript>
  <script type="module" src="js/app.js?v=4.0.0"></script>
</body>

</html>
